<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Stats preview card component</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="stats_card">
      <div class="stats_card_content">
        <h1>Get <span>insights</span> that help your business grow.</h1>
        <p>
          Discover the benefits of data analytics and make better decisions
          regarding revenue, customer experience, and overall efficiency.
        </p>

        <div class="stats_card_stats_wrap">
          <div class="stats_card_stats">
            <h2>10k+</h2>
            <span>COMPANIES</span>
          </div>

          <div class="stats_card_stats">
            <h2>314</h2>
            <span>TEMPLATES</span>
          </div>

          <div class="stats_card_stats">
            <h2>12M+</h2>
            <span>QUERIES</span>
          </div>
        </div>
      </div>

      <div class="stats_card_image">
        <img src="./images/image-header-desktop.jpg" alt="header-image" />
      </div>
    </div>
  </body>
</html>
